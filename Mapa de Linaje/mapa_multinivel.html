<style>
:root{--bg-void:#04060d;--bg-glass:rgba(8,14,30,0.82);--border:rgba(255,255,255,0.07);--border-hi:rgba(168,135,255,0.3);--gold:#c9a96e;--cyan:#38bdf8;--violet:#a78bfa;--orange:#f97316;--text:#f1f5f9;--muted:#64748b;--dim:#1e293b;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg-void);font-family:'DM Sans',sans-serif;color:var(--text)}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 60% 50% at 15% 20%,rgba(99,58,210,.09) 0%,transparent 70%),radial-gradient(ellipse 50% 40% at 85% 75%,rgba(56,189,248,.06) 0%,transparent 70%)}
#mynetwork{position:fixed!important;inset:0!important;width:100%!important;height:100%!important;z-index:1;border:none!important;background:transparent!important}
#ui-header{position:fixed;top:28px;left:32px;z-index:100;animation:fadeDown .9s cubic-bezier(.16,1,.3,1) both}
#ui-header .eyebrow{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.25em;color:var(--gold);text-transform:uppercase;opacity:.85}
#ui-header h1{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:.06em;line-height:1;color:var(--text)}
#ui-header .goldline{width:36px;height:2px;background:linear-gradient(90deg,var(--gold),transparent);margin:6px 0;border-radius:2px}
#ui-header .sub{font-size:11.5px;color:var(--muted);font-weight:300;letter-spacing:.03em}
#ui-stats{position:fixed;top:28px;right:32px;z-index:100;display:flex;flex-direction:column;gap:10px;align-items:flex-end;animation:fadeDown .9s cubic-bezier(.16,1,.3,1) .1s both}
.chip{background:var(--bg-glass);border:1px solid var(--border);border-radius:8px;padding:10px 18px;backdrop-filter:blur(20px);display:flex;flex-direction:column;align-items:flex-end;gap:2px;min-width:115px;box-shadow:0 8px 32px rgba(0,0,0,.5);transition:border-color .2s}
.chip:hover{border-color:var(--border-hi)}
.chip .val{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:.04em;line-height:1}
.chip .lbl{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.chip.violet .val{color:var(--violet)}.chip.cyan .val{color:var(--cyan)}.chip.gold .val{color:var(--gold)}.chip.orange .val{color:var(--orange)}
#ui-legend{position:fixed;bottom:32px;left:32px;z-index:100;background:var(--bg-glass);border:1px solid var(--border);border-radius:10px;padding:18px 22px;backdrop-filter:blur(20px);box-shadow:0 24px 80px rgba(0,0,0,.8);animation:fadeUp 1s cubic-bezier(.16,1,.3,1) .2s both}
#ui-legend .ltitle{font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.lrow{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:12.5px;font-weight:300}
.lrow:last-child{margin-bottom:0}
.ldot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.ldb{width:10px;height:12px;border-radius:2px;flex-shrink:0}
.lstar{width:12px;height:12px;flex-shrink:0;clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.lsq{width:11px;height:11px;flex-shrink:0}
#ui-controls{position:fixed;bottom:32px;right:32px;z-index:100;display:flex;gap:8px;animation:fadeUp 1s cubic-bezier(.16,1,.3,1) .3s both}
.btn{background:var(--bg-glass);border:1px solid var(--border);border-radius:8px;padding:9px 16px;backdrop-filter:blur(20px);color:var(--muted);font-family:'DM Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:all .18s;box-shadow:0 4px 16px rgba(0,0,0,.4)}
.btn:hover{border-color:var(--border-hi);color:var(--text);background:rgba(167,139,250,.1)}
#ui-wm{position:fixed;bottom:36px;left:50%;transform:translateX(-50%);z-index:100;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);pointer-events:none;animation:fadeUp 1.2s cubic-bezier(.16,1,.3,1) .4s both}
.vis-tooltip{background:var(--bg-glass)!important;border:1px solid var(--border-hi)!important;border-radius:8px!important;color:var(--text)!important;font-family:'DM Sans',sans-serif!important;font-size:12px!important;padding:8px 14px!important;backdrop-filter:blur(20px)!important;box-shadow:0 12px 40px rgba(0,0,0,.6)!important}
@keyframes fadeDown{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
</style>
